name: Finalize Provider Ledger

on:
  push:
    branches:
      - feature/goldslotpalase-transaction-ledger

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/goldslotpalase-transaction-ledger
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply financial integrity gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/rewards/service.js')
          text = path.read_text()

          marker = "const ADMIN_ROLES = new Set(['admin', 'superadmin']);\n"
          addition = marker + "const PROVIDER_SYNC_STATE_ID = 'goldslotpalase-transactions';\nconst REWARD_SOURCE_SETTLEMENT_LAG_MS = 15 * 60 * 1000;\n"
          if 'REWARD_SOURCE_SETTLEMENT_LAG_MS' not in text:
              if marker not in text:
                  raise SystemExit('reward constants marker missing')
              text = text.replace(marker, addition, 1)

          old_signature = """export async function finalizeRewardWeekBatch(weekKey, {
            db = getAdminDb(),
            now = Date.now(),
            batchSize = 100,
            concurrency = 6,
            actor = null,
          } = {}) {"""
          new_signature = """export async function finalizeRewardWeekBatch(weekKey, {
            env = process.env,
            db = getAdminDb(env),
            now = Date.now(),
            batchSize = 100,
            concurrency = 6,
            actor = null,
          } = {}) {"""
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit('finalize signature marker missing')

          gate_marker = """  if (actor) requireRole(actor, FINANCE_ROLES);

          const stateRef = db.collection('rewardWeekFinalizations').doc(weekKey);"""
          gate_replacement = """  if (actor) requireRole(actor, FINANCE_ROLES);
          if (env.REWARDS_PAYOUT_ENABLED !== 'true') throw new ServiceError('reward_payout_disabled', 409);
          if (env.GOLDSLOTPALASE_TRANSACTION_SYNC_ENABLED !== 'true') throw new ServiceError('reward_source_disabled', 409);

          const [integritySnapshot, sourceSnapshot] = await Promise.all([
            db.collection('rewardWeekIntegrity').doc(weekKey).get(),
            db.collection('providerSyncStates').doc(PROVIDER_SYNC_STATE_ID).get(),
          ]);
          const integrity = integritySnapshot.exists ? integritySnapshot.data() : null;
          if (integrity?.status === 'blocked') throw new ServiceError('reward_week_integrity_blocked', 409);
          const source = sourceSnapshot.exists ? sourceSnapshot.data() : null;
          const sourceReadyAfterMs = bounds.endMs + REWARD_SOURCE_SETTLEMENT_LAG_MS;
          if (
            source?.status !== 'ready'
            || !Number.isSafeInteger(source?.lastSuccessAtMs)
            || source.lastSuccessAtMs < sourceReadyAfterMs
            || source?.hasMore === true
          ) {
            throw new ServiceError('reward_source_not_ready', 409);
          }

          const stateRef = db.collection('rewardWeekFinalizations').doc(weekKey);"""
          if gate_marker in text:
              text = text.replace(gate_marker, gate_replacement, 1)
          elif "reward_source_not_ready" not in text:
              raise SystemExit('reward gate marker missing')

          text = text.replace(
              "if (row?.weekKey !== weekKey || row?.uid !== doc.data()?.uid) throw new ServiceError('reward_aggregate_integrity_error', 503);",
              "if (row?.weekKey !== weekKey || typeof row?.uid !== 'string' || !row.uid) throw new ServiceError('reward_aggregate_integrity_error', 503);",
              1,
          )

          old_overview = """export async function backofficeRewardOverview(actor, event, { db = getAdminDb(), now = Date.now() } = {}) {
            requireRole(actor, FINANCE_ROLES);
            const requested = String(event?.queryStringParameters?.week ?? '').trim();
            const weekKey = requested || previousRewardWeekKey(now);
            const bounds = rewardWeekBounds(weekKey);
            const stateSnapshot = await db.collection('rewardWeekFinalizations').doc(weekKey).get();
            return {
              policy: REWARD_POLICY,
              week: bounds,
              finalization: stateSnapshot.exists ? stateSnapshot.data() : { weekKey, status: now >= bounds.endMs ? 'pending' : 'open' },
            };
          }"""
          new_overview = """export async function backofficeRewardOverview(actor, event, {
            env = process.env,
            db = getAdminDb(env),
            now = Date.now(),
          } = {}) {
            requireRole(actor, FINANCE_ROLES);
            const requested = String(event?.queryStringParameters?.week ?? '').trim();
            const weekKey = requested || previousRewardWeekKey(now);
            const bounds = rewardWeekBounds(weekKey);
            const [stateSnapshot, integritySnapshot, sourceSnapshot] = await Promise.all([
              db.collection('rewardWeekFinalizations').doc(weekKey).get(),
              db.collection('rewardWeekIntegrity').doc(weekKey).get(),
              db.collection('providerSyncStates').doc(PROVIDER_SYNC_STATE_ID).get(),
            ]);
            const source = sourceSnapshot.exists ? sourceSnapshot.data() : null;
            const sourceReadyAfterMs = bounds.endMs + REWARD_SOURCE_SETTLEMENT_LAG_MS;
            const sourceReady = env.GOLDSLOTPALASE_TRANSACTION_SYNC_ENABLED === 'true'
              && source?.status === 'ready'
              && Number.isSafeInteger(source?.lastSuccessAtMs)
              && source.lastSuccessAtMs >= sourceReadyAfterMs
              && source?.hasMore !== true;
            return {
              policy: REWARD_POLICY,
              week: bounds,
              payoutEnabled: env.REWARDS_PAYOUT_ENABLED === 'true',
              sourceReady,
              sourceReadyAfter: new Date(sourceReadyAfterMs).toISOString(),
              source: source ?? { status: 'not_initialized' },
              integrity: integritySnapshot.exists ? integritySnapshot.data() : { weekKey, status: 'clear' },
              finalization: stateSnapshot.exists ? stateSnapshot.data() : { weekKey, status: now >= bounds.endMs ? 'pending' : 'open' },
            };
          }"""
          if old_overview in text:
              text = text.replace(old_overview, new_overview, 1)
          elif 'sourceReadyAfter:' not in text:
              raise SystemExit('overview marker missing')

          path.write_text(text)

          ledger = Path('src/game/provider-ledger.js')
          ltext = ledger.read_text()
          ltext = ltext.replace('const MAX_SYNC_PAGES = 4;', 'const MAX_SYNC_PAGES = 8;', 1)
          ltext = ltext.replace('pagesLastRun: pages + 1,', 'pagesLastRun: Math.min(pages + 1, maxPages),', 1)
          ledger.write_text(ltext)

          build = Path('scripts/build-cloudflare.mjs')
          btext = build.read_text().replace("'5 */6 * * *'", "'5 * * * *'")
          build.write_text(btext)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate complete Cloudflare backend
        run: |
          git diff --check
          npm run validate

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-provider-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden provider ledger reward settlement gates"
          git push origin HEAD:feature/goldslotpalase-transaction-ledger
