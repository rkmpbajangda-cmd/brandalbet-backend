name: BrandalBet V2 Checks
on:
  push:
    branches: [backend-v2-node-mysql]
  pull_request:
    branches: [backend-v2-node-mysql]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm test