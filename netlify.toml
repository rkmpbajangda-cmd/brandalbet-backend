[build]
  command = "npm run validate"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."rewards-weekly-job"]
  schedule = "15 */6 * * *"

[dev]
  framework = "#static"
  publish = "public"
  port = 8888
