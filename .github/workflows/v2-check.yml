name: BrandalBet V2 Checks
on:
  push:
    branches: [backend-v2-node-mysql, v2-completion-hardening, fix/v2-goldslot-game-flow]
  pull_request:
    branches: [main, backend-v2-node-mysql, v2-completion-hardening]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: brandalbet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - name: Run tests
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/brandalbet_test
        run: npm test
      - name: Apply database schema
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/brandalbet_test
        run: npm run migrate
      - name: Verify migration is idempotent
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/brandalbet_test
        run: npm run migrate
